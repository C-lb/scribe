<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scribe</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="bar">
      <button
        id="sidebar-toggle"
        class="hamburger"
        type="button"
        aria-label="Sessions"
        aria-controls="history"
        aria-expanded="true"
        title="Sessions"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <h1>Scribe</h1>
      <div class="bar__meta">
        <span id="timer" class="timer">00:00</span>
        <span id="status" class="status" aria-live="polite"></span>
      </div>
      <div class="meter" id="meter" hidden>
        <label class="meter__label" id="meter-label" for="mic-select">Input</label>
        <select id="mic-select" class="mic-select" title="Which microphone Scribe records from"></select>
        <span
          class="meter__track"
          role="meter"
          aria-labelledby="meter-label"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          id="meter-track"
        ><span class="meter__fill" id="meter-fill"></span></span>
      </div>
      <button
        id="reconnect"
        class="ghost reconnect"
        type="button"
        title="Reopen the microphone without ending the recording"
        hidden
      >
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Reconnect mic</span>
      </button>
      <button id="record" class="record" type="button">Start recording</button>
    </header>

    <aside id="history" class="drawer" aria-label="Sessions">
      <div id="history-list" class="drawer__list"></div>
      <footer class="drawer__foot">
        <button
          id="history-new-category"
          class="ghost"
          type="button"
          title="Add a category to group sessions under"
        >New category</button>
        <button
          id="history-restore"
          class="ghost"
          type="button"
          title="Put the library back to how it was when Scribe opened"
          hidden
        >Restore library</button>
      </footer>
    </aside>
    <div id="scrim" class="scrim"></div>

    <div id="banner" class="banner-region" hidden></div>

    <main class="panes">
      <section class="pane" aria-labelledby="transcript-heading">
        <h2 id="transcript-heading">Transcript</h2>
        <audio id="player" preload="none"></audio>
        <p id="transcript-reason" class="actions__reason" aria-live="polite" hidden></p>
        <div id="transcript" class="transcript" role="log" aria-live="polite"></div>
        <button id="jump" class="jump" type="button" hidden>Jump to live</button>
      </section>

      <section class="pane" aria-labelledby="summary-heading">
        <div class="pane__head">
          <h2 id="summary-heading">Summary</h2>
          <div class="pane__actions" id="summary-actions">
            <button id="summary-copy" class="ghost" type="button">Copy</button>
            <button id="summary-save" class="ghost" type="button">Save</button>
            <button id="summary-share" class="ghost" type="button" hidden>Share</button>
          </div>
        </div>
        <p id="summary-actions-reason" class="actions__reason" aria-live="polite" hidden></p>
        <div id="summary" class="summary">
          <p class="empty">The first summary appears after about five minutes.</p>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
